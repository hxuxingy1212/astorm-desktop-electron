[package]
name = "astorm-server"
version.workspace = true
edition.workspace = true
description = "astorm 无头服务宿主：把 astorm-core 门面暴露为 HTTP + SSE API（云容器部署形态）"
license.workspace = true
keywords = ["agent", "server", "api"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "astorm-server"
path = "src/main.rs"

# 页面渲染助手（websearch/webfetch 的 Chromium 渲染后端）：与 Rust 侧 WebRender
# 说同种 stdin/stdout 行 JSON 协议（见 astorm-core tool/search/renderer.rs），
# 桌面由 Electron 二进制 + page-render.cjs 承担，容器由本助手 + Chromium 承担。
[[bin]]
name = "astorm-render"
path = "src/bin/render.rs"

[dependencies]
astorm-common = { path = "../astorm-common" }
astorm-core = { path = "../astorm-core" }
astorm-storage = { path = "../astorm-storage" }
astorm-mail = { path = "../astorm-mail" }
astorm-memory = { path = "../astorm-memory" }
astorm-sandbox = { path = "../astorm-sandbox" }
llm-provider = { path = "../llm-provider" }
reqwest = { workspace = true }

# CDP 客户端：驱动容器内 Chromium（webRender 的渲染后端）
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tower = "0.5"
tower-http = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "io-std"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
