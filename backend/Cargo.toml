[workspace]
resolver = "2"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
jsonschema = "0.49"
napi = { version = "3", features = ["tokio_rt", "web_stream", "serde-json", "napi5"] }
napi-derive = "3"
napi-build = "2"
os_pipe = "1"
portable-pty = "0.8"
quick-xml = { version = "0.40", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tantivy = "0.26"
tantivy-jieba = "0.19"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-cron-scheduler = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"

# release 体积优化:thin LTO + 单 codegen 单元 + 剥符号(跨平台,Windows dll 也生效;
# 只剥符号表不动 PE 导出表,napi 注册不受影响;macOS 侧 sync-backend.mjs 的 strip -x 兜底旧产物)
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
