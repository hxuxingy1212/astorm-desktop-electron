<!doctype html>
<html lang="zh-CN" data-site-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Astorm 是一个能读写文件、运行命令、查资料、做文档的桌面智能体。真实界面交互预览，本地优先，模型可换。"
    />
    <title>Astorm · 会动手的桌面智能体</title>
  </head>
  <body>
    <div class="site-glow" aria-hidden="true"></div>

    <header class="site-nav">
      <div class="container nav-inner">
        <a class="brand" href="#top" aria-label="Astorm 首页">
          <span class="brand-mark"><img data-logo alt="" /></span>
          <span class="brand-name">Astorm</span>
        </a>
        <nav class="nav-links" aria-label="主导航">
          <a href="./docs.html">文档</a>
        </nav>
        <div class="nav-actions">
          <a class="gh-address" id="github-link" href="https://github.com/" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z" />
            </svg>
            <span id="github-address">github.com/</span>
          </a>
          <a class="btn btn-primary btn-sm" id="download-link" href="https://github.com/" target="_blank" rel="noreferrer">下载</a>
          <button class="icon-btn" id="site-theme" type="button" aria-label="切换明暗主题">
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5" stroke-linecap="round" />
            </svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 14.3A8.5 8.5 0 0 1 9.7 4a8.5 8.5 0 1 0 10.3 10.3Z" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="demo" id="demo">
        <div class="container">
          <div class="window-caption">
            <span class="live-badge"><span class="live-dot"></span><span class="live-text">可交互预览</span></span>
            <div class="caption-actions">
              <button class="tool-btn" id="app-theme" type="button" aria-label="切换应用明暗" title="切换应用明暗">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="4.2" />
                  <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5" stroke-linecap="round" />
                </svg>
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M20 14.3A8.5 8.5 0 0 1 9.7 4a8.5 8.5 0 1 0 10.3 10.3Z" stroke-linejoin="round" />
                </svg>
              </button>
              <button class="tool-btn" id="app-reset" type="button" aria-label="重置预览数据" title="重置预览数据">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 11a8 8 0 1 1 2.3 5.7M4 5v6h6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <a class="tool-btn full-btn" id="app-fullscreen" href="./app/index.html#/chat/preview-auth" target="_blank" rel="noreferrer" aria-label="全屏打开" title="全屏打开">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </a>
            </div>
          </div>

          <div class="window-shell">
            <div class="window-body">
              <!-- 红黄绿直接覆盖在应用侧栏的品牌行上（应用以 macOS 桌面形态渲染，品牌行为系统按钮预留 76px） -->
              <div class="traffic traffic-overlay" aria-hidden="true">
                <i class="red"></i><i class="yellow"></i><i class="green"></i>
              </div>
              <div class="frame-loading" id="frame-loading">
                <span class="loader-ring"></span>
                <span>正在载入界面…</span>
              </div>
              <iframe
                id="preview-frame"
                title="Astorm 交互预览"
                src="./app/index.html#/chat/preview-auth"
                loading="eager"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./site-main.ts"></script>
  </body>
</html>
