[package]
name = "astorm-mail"
version.workspace = true
edition.workspace = true
description = "多账户邮件服务：AES-256-GCM 加密账号库 + IMAP 收信 + SMTP 发信 + 本地 SQLite 缓存"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
astorm-common = { path = "../astorm-common" }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
base64 = { workspace = true }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
mime_guess = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
